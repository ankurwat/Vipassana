name: Update Vipassana Schedule

on:
  schedule:
    # 5:00 PM PT on the 1st and 15th of every month.
    # PST (UTC-8) -> 01:00 UTC the next day. PDT (UTC-7) -> 00:00 UTC the next day.
    # Cover both so we land at ~5pm PT year-round; the script is idempotent.
    - cron: '0 0 2,16 * *'
    - cron: '0 1 2,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scripts/update_schedule.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain vipassana_schedule.html)" ]]; then
            git add vipassana_schedule.html
            git commit -m "Update Vipassana schedule ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
